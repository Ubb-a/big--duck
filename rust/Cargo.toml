[workspace]
members = ["core", "mobile-bridge"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.81"

[workspace.dependencies]
grammers-client = "=0.7.0"
grammers-session = "=0.7.0"
tokio = { version = "1.41.1", features = ["full"] }
thiserror = "2.0.3"
tracing = "0.1.40"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "derive", "migrate"] }
sha2 = "0.10.9"
hex = "0.4.3"
mime_guess = "2.0.5"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
aes-gcm = "0.10.3"
argon2 = "0.5.3"
keyring = { version = "3.6.3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
rand = "0.8.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
